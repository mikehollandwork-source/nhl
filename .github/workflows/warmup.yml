name: warmup

on:
  schedule:
    - cron: "*/15 16-23 * * *"   # every 15 min, noon-8pm ET: catches games entering warmups
    - cron: "*/15 0-3 * * *"     # 8pm-midnight ET (late West Coast games)
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date YYYY-MM-DD (blank = today, US/Eastern)"
        required: false
      dry_run:
        description: "Print messages instead of posting to Telegram"
        type: boolean
        default: false

concurrency:
  group: data-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NHL_DATA_DIR: ${{ github.workspace }}/data
      NHL_DATE: ${{ inputs.date }}
      NHL_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Referees, scratches and confirmed goalies at warmups
        run: python -m nhlmodel.pipelines.warmup
      - uses: ./.github/actions/save-data
        if: ${{ !cancelled() }}
        with:
          message: "warmup ${{ github.run_id }}"
      - uses: ./.github/actions/notify-failure
        if: ${{ failure() }}
