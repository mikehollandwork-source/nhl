name: morning

on:
  schedule:
    - cron: "43 15 * * *"   # ~11:43 ET (EDT) / 10:43 ET (EST)
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date YYYY-MM-DD (blank = today, US/Eastern)"
        required: false
      dry_run:
        description: "Print messages instead of posting to Discord"
        type: boolean
        default: false
      force:
        description: "Post again even if this run's post already went out"
        type: boolean
        default: false

concurrency:
  group: data-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NHL_DATA_DIR: ${{ github.workspace }}/data
      NHL_DATE: ${{ inputs.date }}
      NHL_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Project today's slate
        run: python -m nhlmodel.pipelines.daily --run morning ${{ inputs.force && '--force' || '' }}
      - uses: ./.github/actions/save-data
        if: ${{ !cancelled() }}
        with:
          message: "morning ${{ github.run_id }}"
      - uses: ./.github/actions/notify-failure
        if: ${{ failure() }}
