name: Set up NHL model
description: Check out the data branch into ./data, install Python and the package.
runs:
  using: composite
  steps:
    - name: Check out data branch
      uses: actions/checkout@v4
      with:
        ref: data
        path: data
        fetch-depth: 1
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install
      shell: bash
      run: pip install -e .
